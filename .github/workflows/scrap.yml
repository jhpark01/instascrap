name: Telegram Scrap & Google Drive Sync

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (add, delete, restore, memo)'
        required: false
        default: ''
      url:
        description: 'Instagram or YouTube URL'
        required: false
        default: ''
      memo:
        description: 'Memo text'
        required: false
        default: ''
      shortcode:
        description: 'Target shortcode'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install latest rclone & config
        env:
          RCLONE_SECRET: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -sO https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          sudo chmod +x /usr/local/bin/rclone
          rclone version
          printf '%s\n' "$RCLONE_SECRET" > rclone.conf

      - name: Sync media, poll Telegram, upload to Google Drive, rebuild HTML
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INPUT_ACTION: ${{ github.event.inputs.action }}
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_MEMO: ${{ github.event.inputs.memo }}
          INPUT_SHORTCODE: ${{ github.event.inputs.shortcode }}
        run: |
          node build.mjs
          node bot.mjs --once
          node sync-drive.mjs

      - name: Commit and push updated web-book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json .tg_offset deleted.json || true
          git diff --staged --quiet || (git commit -m "chore: update scraps and Drive links" && git push)
