name: Telegram Scrap & Google Drive Sync

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install rclone & config
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          printf '%s\n' "${{ secrets.RCLONE_CONF }}" > rclone.conf

      - name: Initial KakaoTalk sync & Google Drive upload (runs only for unmapped items)
        run: |
          node build.mjs
          node sync-drive.mjs

      - name: Poll Telegram, upload new media to Google Drive, rebuild HTML
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node bot.mjs --once

      - name: Commit and push updated web-book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json .tg_offset deleted.json || true
          git diff --staged --quiet || (git commit -m "chore: update scraps and Drive links [skip ci]" && git push)
